[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "littlerun"
version = "0.1.0"
description = "Reference inference runtime for LittleBit / LittleBit-2 sub-1-bit factorized LLM checkpoints"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.5",
  "safetensors>=0.4",
  "transformers>=4.51,<5",
  "jinja2>=3.1",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
littlerun = "littlerun.cli:main"

[tool.setuptools.packages.find]
include = ["littlerun*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "reference: needs the SamsungLabs/LittleBit checkout (LITTLEBIT_REF_PATH)",
  "checkpoint: needs the real checkpoint (LITTLERUN_CKPT)",
]

[tool.setuptools.package-data]
littlerun = ["manifests/*.json", "kernels/*.cpp"]
